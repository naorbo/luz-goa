name: Youth Center WhatsApp Reminders (09:30 Morning & 20:00 Evening-Before IST)

on:
  schedule:
    # Off-peak fallback schedules (Asia/Kolkata = UTC+5:30):
    # 04:05 UTC = 09:35 IST (Morning reminder for today's event)
    - cron: '5 4 * * *'
    # 14:23 UTC = 19:53 IST (Evening-before reminder for tomorrow's event)
    - cron: '23 14 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode (cron-once checks scheduled date; sample sends next upcoming event)'
        required: true
        default: 'cron-once'
        type: choice
        options:
          - cron-once
          - sample
      timing:
        description: 'Reminder slot (morning = today, evening = tomorrow, auto = infer from IST hour)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - evening
      target_date_ist:
        description: 'Optional override date (YYYY-MM-DD) for cron-once mode'
        required: false
        default: ''
        type: string
      force_resend:
        description: 'Force resend even if already logged in sent cache (default false)'
        required: false
        default: false
        type: boolean

concurrency:
  group: youth-center-whatsapp-reminder
  cancel-in-progress: false

jobs:
  send-morning-reminder:
    name: Send Youth Center WhatsApp Reminder (Cloud)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore persisted WhatsApp cloud session & sent log
        uses: actions/cache/restore@v4
        with:
          path: |
            .wa-session-cloud
            scripts/.youth-reminders-sent.json
          key: wa-session-cloud-${{ github.run_id }}
          restore-keys: |
            wa-session-cloud-

      - name: Install Baileys & Sharp for WhatsApp + Poster Overlay
        run: |
          npm install --no-save --no-audit --no-fund @whiskeysockets/baileys@7.0.0-rc14 sharp@0.33.5

      - name: Run Youth Center WhatsApp Reminder
        env:
          WA_SESSION_GZ_B64: ${{ secrets.WA_SESSION_GZ_B64 }}
          TARGET_DATE_IST: ${{ inputs.target_date_ist }}
          FORCE_RESEND: ${{ inputs.force_resend }}
          REMINDER_TIMING: ${{ inputs.timing || (github.event.schedule == '23 14 * * *' && 'evening' || (github.event.schedule == '5 4 * * *' && 'morning' || 'auto')) }}
        run: |
          MODE="${{ inputs.mode || 'cron-once' }}"
          if [ "$MODE" = "sample" ]; then
            node scripts/send-youth-reminder-via-podkids.cjs --sample --timing="$REMINDER_TIMING"
          else
            node scripts/send-youth-reminder-via-podkids.cjs --cron-once --timing="$REMINDER_TIMING"
          fi

      - name: Save updated WhatsApp cloud session & sent log
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .wa-session-cloud
            scripts/.youth-reminders-sent.json
          key: wa-session-cloud-${{ github.run_id }}
